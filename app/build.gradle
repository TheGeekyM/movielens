plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }
android {
    namespace "com.movielens"
    compileSdk 36
    defaultConfig { applicationId "com.movielens"; minSdk 24; targetSdk 36; versionCode 1; versionName "1.0"; ndk { abiFilters "arm64-v8a" } }
    buildFeatures { viewBinding true }
    packaging { resources { excludes += ["META-INF/*"] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    def cx = "1.4.2"
    implementation "androidx.camera:camera-camera2:$cx"
    implementation "androidx.camera:camera-lifecycle:$cx"
    implementation "androidx.camera:camera-view:$cx"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.anthropic:anthropic-java:3.2.0"
}
dependencies { testImplementation "junit:junit:4.13.2" }
